---
os:
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"

gui:
  nerdFontsVersion: 3
  border: single
  spinner:
    frames:
      - ⠋
      - ⠙
      - ⠹
      - ⠸
      - ⠼
      - ⠴
      - ⠦
      - ⠧
      - ⠇
      - ⠏

git:
  overrideGpg: true
  pagers:
    - pager: diff-so-fancy
    - externalDiffCommand: "difft --color=always --display=inline"

keybinding:
  universal:
    copyToClipboard: "y"
    copyFileInfoToClipboard: <c-o>
